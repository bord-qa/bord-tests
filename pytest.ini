[pytest]
testpaths = tests
base_url = https://app.bord.one
# Один повтор упавшего теста: сеть/прод иногда отвечают медленно. Больше не
# ставим — на старте суиты важнее видеть настоящие гонки, чем прятать их ретраями.
# -m "not manual": блоки, которые тратят невосполнимое (токены Public API, ecom-100162),
# в обычный прогон не идут. Запуск вручную: pytest -m manual
addopts = --reruns 1 --reruns-delay 3 -m "not manual"
render_collapsed = passed,skipped,rerun,xfailed,xpassed
markers =
    smoke: быстрый дымовой набор критичных проверок. Запуск: pytest -m smoke
    requires_auth: тесту нужен вход тест-учёткой (tests/fixtures/users.json или BORD_EMAIL/BORD_PASSWORD)
    manual: только ручной запуск (pytest -m manual) — тест тратит то, что нельзя вернуть
    writes_data: тест создаёт/меняет данные в организации BORD QA и убирает их за собой
